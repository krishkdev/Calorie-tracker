<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131415" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calories" />
    <meta
      name="description"
      content="Free, open-source calorie tracker. Bring your own AI API key. Logs stay on your device. AI runs with your chosen provider."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Calorie Tracker</title>
    <script>
      // Apply the saved theme before first paint so neither the splash nor
      // the app flashes white for dark-mode users. Mirrors src/lib/theme.ts.
      (function () {
        try {
          var t = localStorage.getItem('ct-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable: default to light */
        }
      })();
    </script>
    <style>
      /* Splash screen: shown by plain HTML/CSS before any JavaScript loads and
         removed by the app once the local database has answered. Colours are
         duplicated from src/index.css on purpose: the stylesheet has not loaded
         yet when this is first painted. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f7f5;
        color: #1c1c1b;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 260ms ease-out;
      }
      .dark #splash {
        background: #131415;
        color: #f3f3ef;
      }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-brand {
        display: flex;
        align-items: center;
        font-size: 34px;
        font-weight: 750;
        letter-spacing: -1.5px;
        animation: splash-in 420ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #splash .splash-brand svg {
        width: 34px;
        height: 34px;
        margin-right: 9px;
      }
      #splash .splash-period {
        color: #696a64;
      }
      .dark #splash .splash-period {
        color: #a2a39e;
      }
      #splash .splash-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0;
        animation: splash-pulse 1.1s ease-in-out 500ms infinite;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.15;
        }
        50% {
          opacity: 0.7;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash .splash-brand,
        #splash .splash-dot {
          animation: none;
          transition: none;
        }
        #splash .splash-dot {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Calorie Tracker">
      <div class="splash-brand">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.9"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M20 4c-9-1-16 2-16 9a7 7 0 0 0 7 7c7 0 10-7 9-16Z" />
          <path d="M4 21 15 10M9 16v-5M9 16h5" />
        </svg>
        Calorie<span class="splash-period">.</span>
      </div>
      <span class="splash-dot" aria-hidden="true"></span>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Calorie Tracker needs JavaScript to run. Everything stays on your device.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
